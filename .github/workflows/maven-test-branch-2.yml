name: Maven Tests

on:
  push:
    branches: 
      - main
      - Turner2405-patch-1
  pull_request:
    branches:
      - main
      - Turner2405-patch-1
  workflow_dispatch:


jobs:
  test-main:
    name: Run all test on main branch
    if: github.ref == 'refs/heads/main' || (github.event_name == 'pull_request' && github.base_ref == 'main')
    runs-on: ubuntu-latest

    steps:
      - name: Check out repository
        uses: actions/checkout@v6

      - name: Set up Java 21
        uses: actions/setup-java@v6
        with:
          distribution: temurin
          java-version: '21'
          cache: maven

